<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Crypsis</title><link rel="stylesheet" href="popup.css" /></head><body><main class="popup-shell" aria-live="polite"><header class="topbar"><div class="brand-lockup"><span class="shield-mark" aria-hidden="true"></span><span>Crypsis</span></div><button id="openOptions" class="icon-button" type="button" aria-label="Open Crypsis settings">Settings</button></header><section class="sentinel-card"><div class="halo" aria-hidden="true"><span class="halo-core"><span id="stateIcon">ON</span></span></div><div class="state-copy"><p class="eyebrow">Protection</p><h1 id="protectionStatus">Filtering active</h1><p id="protectionHint">Network and cosmetic filtering are running.</p></div><label class="toggle-row" for="globalToggle"><span>Master filter</span><input id="globalToggle" type="checkbox" role="switch" checked /><span class="switch-track" aria-hidden="true"></span></label></section><section class="site-card"><div><p class="eyebrow">Current site</p><h2 id="siteName">Loading page</h2><p id="siteMeta">Checking page controls</p></div><button id="siteToggle" class="secondary-button" type="button" disabled>Pause on site</button></section><section class="activity-card"><div class="activity-top"><div><p class="eyebrow">This page</p><strong id="matchCount">0</strong><span> requests matched</span></div><span class="signal-dot" aria-hidden="true"></span></div><p class="fine-print">The count is available while the extension is loaded for development. Blocking remains active when no count is shown.</p></section><p id="errorMessage" class="error-message" role="alert"></p></main><script src="popup.js"></script></body></html>
